include classpath("application.conf")

node-address { protocol = http, host = "*", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }

# Mirrors the AWS queue: visibility timeout + DLQ after 3 receives.
queues {
  quizforge-jobs-dlq { }
  quizforge-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "quizforge-jobs-dlq", maxReceiveCount = 3 }
  }
  # the scorer's own queue (the judge runs in a separate service)
  quizforge-scoring-dlq { }
  quizforge-scoring {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "quizforge-scoring-dlq", maxReceiveCount = 3 }
  }
}
