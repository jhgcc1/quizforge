x-common-env: &common
  NODE_ENV: development # AUTH_MODE=local is refused when NODE_ENV=production
  DATABASE_URL: "postgres://quizforge:quizforge@postgres:5432/quizforge"
  AWS_ENDPOINT_URL_SQS: "http://elasticmq:9324"
  AWS_REGION: us-east-2
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  SQS_QUEUE_URL: "http://elasticmq:9324/000000000000/quizforge-jobs"
  SCORING_QUEUE_URL: "http://elasticmq:9324/000000000000/quizforge-scoring"
  LOCAL_JWT_SECRET: "compose-local-secret-compose-local-secret"
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizforge
      POSTGRES_PASSWORD: quizforge
      POSTGRES_DB: quizforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizforge -d quizforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  # SQS-compatible queue for local dev (same API as AWS SQS).
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

  # ---- full stack in containers (the same images that run on ECS):  docker compose --profile app up --build
  # Local auth + fake LLM by default so it runs offline; set LLM_MODE=minimax and MINIMAX_API_KEY to use the real model.
  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: quizforge-api:local
    command: ["node", "--import", "tsx", "node_modules/@quizforge/db/src/migrate.ts"]
    environment: { DATABASE_URL: "postgres://quizforge:quizforge@postgres:5432/quizforge" }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    profiles: ["app"]
    image: quizforge-api:local
    command: ["node", "--import", "tsx", "src/server.ts"]
    ports: ["18080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      elasticmq: { condition: service_started }
    environment:
      <<: *common
      AUTH_MODE: local
      QUEUE_MODE: sqs

  # The worker image is built with the semantic prompt-injection detector (Dockerfile target runtime-detector: Llama Prompt Guard 2
  # 86M, multilingual, baked into the image at /models/prompt-guard-2, so nothing is downloaded at run time) and runs it in
  # `flag` mode by default: a finding is recorded and the document goes on. INJECTION_DETECTOR=block rejects flagged documents;
  # INJECTION_DETECTOR=off disables it. The first build downloads 1.1 GB (verified by sha256); later builds reuse the layer.
  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/worker/Dockerfile, target: runtime-detector }
    image: quizforge-worker:local
    mem_limit: 4g
    environment:
      <<: *common
      INJECTION_DETECTOR: ${INJECTION_DETECTOR:-flag}
      LLM_MODE: ${LLM_MODE:-fake}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
    depends_on:
      migrate: { condition: service_completed_successfully }
      elasticmq: { condition: service_started }

  # The scorer: the same CODE as the worker (WORKER_ROLE=score), consuming the scoring queue. It judges quizzes
  # AFTER they are ready. Locally it reuses the worker's image so the stack builds once; in AWS it is deployed
  # from the `<sha>-slim` tag, built from the Dockerfile target `runtime` — same code without the 1.6 GB
  # detector, which this role never loads (it reads text the generate role already admitted and stored).
  scorer:
    profiles: ["app"]
    image: quizforge-worker:local
    environment:
      <<: *common
      WORKER_ROLE: score
      SQS_QUEUE_URL: "http://elasticmq:9324/000000000000/quizforge-scoring"
      LLM_MODE: ${LLM_MODE:-fake}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
    depends_on:
      worker: { condition: service_started }

  web:
    profiles: ["app"]
    # the front end is its own repository: run scripts/web.sh first (it checks out its main into ./web)
    build: { context: ./web }
    image: quizforge-web:local
    environment:
      AUTH_MODE: local
      LOCAL_JWT_SECRET: "compose-local-secret-compose-local-secret"
      APP_URL: "http://localhost:13000"
      API_URL: "http://api:8080"
      ALLOW_SIGNUP: "true"
      SOCIAL_PROVIDERS: "google,facebook"
    ports: ["13000:3000"]
    depends_on: [api]

volumes:
  pgdata:
