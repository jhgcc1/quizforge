name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a new push to a PR cancels its older run; main runs are never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # promptfoo needs Node >= 22.22; the version is pinned so a new release cannot change the gate by itself
  PROMPTFOO_VERSION: "0.124.1"

# `shell: bash` makes GitHub run `bash -eo pipefail`: a failure on the left of a pipe can never be masked
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all workspaces)
        run: pnpm typecheck
      - name: Lint (ESLint, typescript-eslint recommended rules)
        run: pnpm lint
      - name: Unit tests (scoring, schemas, SSRF guard, JSON extraction, graph, migration policy ...)
        run: pnpm test
      - name: "LLM-evaluation harness, offline (fake model, free; proves the golden-set runner itself still works)"
        run: pnpm --filter @quizforge/evals eval:offline

  # ---------------------------------------------------------------- integration (real Postgres)
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quizforge, POSTGRES_PASSWORD: quizforge, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quizforge" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://quizforge:quizforge@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Unit + integration tests with coverage (idempotency, concurrency, API, worker, sweeper, migrate entrypoint); fails below the thresholds in vitest.coverage.config.ts
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["## Test coverage (unit + integration)", "", "| Metric | Covered | Count |", "|---|---|---|", ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn

  # ---------------------------------------------------------------- migrations
  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quizforge, POSTGRES_PASSWORD: quizforge, POSTGRES_DB: quizforge }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quizforge" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://quizforge:quizforge@localhost:5432/quizforge
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the policy check diffs against the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Schema and migrations are in sync (no uncommitted drift)
        run: |
          pnpm --filter @quizforge/db db:generate
          if [ -n "$(git status --porcelain -- packages/db)" ]; then
            echo "::error::schema.ts changed without a committed migration. Run 'pnpm --filter @quizforge/db db:generate' and commit the result."
            git status --porcelain -- packages/db
            exit 1
          fi

      - name: Migration policy (expand/contract, released migrations are immutable)
        if: github.event_name == 'pull_request'
        env: { BASE_REF: "origin/${{ github.base_ref }}" }
        run: node packages/db/policy/check-migrations.mjs

      - name: Apply all migrations to an empty database with the production entrypoint
        run: pnpm --filter @quizforge/db db:migrate

      - name: Running them again is a no-op (idempotent)
        run: pnpm --filter @quizforge/db db:migrate

  # ---------------------------------------------------------------- end-to-end (real browser)
  #
  # There is no browser test in this repository's CI. The spec still lives here (e2e/quiz.spec.ts) because its harness
  # is anchored here -- prepare.ts runs the real migrations from packages/db -- but it is RUN by the front end's CI
  # (jhgcc1/quizforge-web), which checks this repository out to get it. The test drives a UI that lives there, so it
  # belongs to the pull requests that change that UI.
  #
  # What covers this side instead: the API is pinned by packages/contract and its boundary tests, the integration
  # suite exercises the API and the worker against a real Postgres, and the deployed stack is smoke-tested in a
  # browser after every deploy (the smoke step in quizforge-infra's apply.yml), with rollback.yml to go back.
  #
  # The trade: a back end change that breaks the UI is caught after the deploy rather than before it. That is the
  # usual arrangement for a service deployed on its own, and the smoke test plus rollback is what makes it safe.

  # ---------------------------------------------------------------- images build + vulnerability scan
  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the front end (jhgcc1/quizforge-web at main) into web/
        uses: actions/checkout@v4
        with:
          repository: jhgcc1/quizforge-web
          ref: main
          path: web
      - uses: docker/setup-buildx-action@v3
      - name: Build web, api, worker and redteam images
        run: |
          for s in api worker web redteam; do
            if [ "$s" = web ]; then dockerfile=web/Dockerfile; ctx=web; elif [ "$s" = redteam ]; then dockerfile=guardrails/promptfoo/Dockerfile; ctx=.; else dockerfile=$s/Dockerfile; ctx=.; fi
            T=""; [ "$s" = worker ] && T="--target runtime-detector" # the worker image carries the Llama Prompt Guard 2 model
            [ "$s" = redteam ] && T="--build-arg GIT_SHA=$GITHUB_SHA" # the red team report names the commit
            docker buildx build -f $dockerfile $T -t quizforge-$s:ci --load \
              --cache-from type=gha,scope=$s --cache-to type=gha,scope=$s,mode=max $ctx
          done
      - name: Scan images (fail on fixable HIGH/CRITICAL)
        run: |
          for s in api worker web redteam; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore quizforge-$s:ci
          done

  # ---------------------------------------------------------------- secrets
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  # ---------------------------------------------------------------- prompt and input-guard gate (every PR, no secrets)
  # promptfoo, offline: runs the real pipeline with a deterministic fake model. Proves that hidden or encoded instructions
  # (Base64, hex, ROT13, invisible Unicode, HTML comments, look-alike letters...) and unsupported languages are rejected BEFORE any
  # model call, that bad topics are refused, that plain instructions arrive sanitized inside <document> tags, and that the
  # prompts keep their safety rules. Any change to a prompt, the guard, the attack corpus or a fixture goes through it.
  promptfoo:
    name: promptfoo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: promptfoo offline suite (no model, no secrets)
        run: guardrails/run-suite.sh offline
      - name: Prompt catalog (dry run, nothing is sent to Langfuse)
        run: pnpm prompts:publish -- --dry-run
      - name: Say when the live suite will run for this change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '^(packages/llm/src/(prompts|judge|quiz-graph|llm-input|language|output-guard|structured|detector)\.ts|packages/core/src/(guard|attacks|injection-rules)\.ts|guardrails/detector/|evals/fixtures/|guardrails/promptfoo/|prompts/)' || true)
          if [ -n "$changed" ]; then
            echo "::notice title=Prompt or guard files changed::The live promptfoo suite (real model) runs on main before the deploy and every night. Files: $(echo $changed | tr '\n' ' ')"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: promptfoo-offline, path: guardrails/promptfoo/out/offline.json, retention-days: 30 }

  # ---------------------------------------------------------------- LLM quality gate (real model, main only)
  # Real MiniMax + Langfuse experiment over the golden set. Needs the secrets of the `llm-eval` environment, which
  # only `main` may use, and costs a few cents, so it gates the DEPLOY rather than every PR.
  llm-eval:
    name: llm-eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: llm-eval
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Golden-set evaluation (fails the pipeline if quality drops below the thresholds)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm --filter @quizforge/evals exec tsx src/run.ts | tee eval.txt
      - name: Summary
        if: always()
        run: |
          { echo '### LLM evaluation (golden set)'; echo '```'; cat eval.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: promptfoo live suite (prompt injection and agent purpose, real model)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: guardrails/run-suite.sh live
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: "evals/report.json\nguardrails/promptfoo/out/live.json", retention-days: 30 }

  # ---------------------------------------------------------------- LLM quality gate on the pull request (real model, no Langfuse)
  # The same golden-set evaluation and live promptfoo suite as `llm-eval`, BEFORE the merge, when the change can alter what the model
  # sees or returns (prompts, LLM code, guard, attack corpus, fixtures, evals, promptfoo). A pull request that makes the quizzes worse
  # cannot be merged. Differences from the main job, on purpose:
  #   * it only gets MINIMAX_API_KEY (environment `llm-eval-pr`): NO Langfuse keys, so a pull request never writes to Langfuse
  #     (Langfuse only receives data from main, nightly and production);
  #   * pull requests from forks never get secrets (this job is skipped for them);
  #   * when no relevant file changed it finishes green in seconds without calling the model (costs nothing).
  llm-eval-pr:
    name: llm-eval-pr
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: llm-eval-pr
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Did this change touch what the model sees or returns?
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '^(packages/llm/|packages/core/src/|guardrails/detector/|evals/|guardrails/promptfoo/|prompts/)' || true)
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "::notice title=Real-model evaluation will run::$(echo $changed | tr '\n' ' ')"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No prompt, LLM, guard or eval file changed: the real-model evaluation is not needed."; fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Golden-set evaluation (real model; fails if quality drops below the thresholds)
        if: steps.scope.outputs.run == 'true'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: pnpm --filter @quizforge/evals exec tsx src/run.ts | tee eval.txt
      - name: Summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          { echo '### LLM evaluation on the pull request (golden set)'; echo '```'; cat eval.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: promptfoo live suite (prompt injection and agent purpose, real model)
        if: steps.scope.outputs.run == 'true'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: guardrails/run-suite.sh live
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with: { name: eval-report-pr, path: "evals/report.json\nguardrails/promptfoo/out/live.json", retention-days: 30 }

  # ---------------------------------------------------------------- red team sample (every PR from this repository, and every merge to main)
  # 50 FROZEN attacks (en, pt, es; 12 intents with canaries; Base64, ROT13, leetspeak, jailbreak templates, other tones) run through the real
  # pipeline: first offline (guard, language policy, fake model), then live (MiniMax). Plain code decides: a canary in the reply fails the job.
  # Same rules as llm-eval-pr: only MINIMAX_API_KEY (environment `llm-eval-pr`, no Langfuse keys), never for pull requests from forks.
  # NOT a required check (the maintainer decides). Details: guardrails/promptfoo/README.md.
  redteam-sample:
    name: redteam-sample
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: llm-eval-pr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Red team sample (offline stage, then live stage; fails if a canary leaks)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: guardrails/run-suite.sh redteam-sample
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: redteam-sample, path: "guardrails/promptfoo/out/redteam-sample-offline.json\npromptfoo/out/redteam-sample-live.json", retention-days: 30 }

  # ---------------------------------------------------------------- prompts to Langfuse (main only, after every gate)
  # A prompt reaches Langfuse Prompt Management ONLY from here: after the pull request checks passed (and blocked the merge if not),
  # and after the same checks, the real-model evaluation and the live promptfoo suite passed again on main. A prompt whose text
  # differs from the latest `production` version becomes a new version labelled production and sha-<commit>.
  publish-prompts:
    name: publish-prompts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, integration, migrations, docker-build, secrets-scan, promptfoo, llm-eval]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: llm-eval # holds the Langfuse keys; only main may use it
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Publish the prompts that changed
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm prompts:publish

  # ---------------------------------------------------------------- publish images to ECR (main only, after EVERY gate)
  # Builds and pushes the images that jhgcc1/quizforge-infra deploys (workflow Deploy, manual, with approval). This job deploys NOTHING: its
  # role can only push to ECR. Tags are immutable (tag = commit sha); an existing tag is skipped.
  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, integration, migrations, docker-build, secrets-scan, promptfoo, llm-eval]
    runs-on: ubuntu-24.04-arm # native arm64 images for Graviton Fargate
    timeout-minutes: 45
    concurrency: { group: publish-images, cancel-in-progress: false }
    permissions:
      id-token: write # OIDC: the ECR push-only role quizforge-gha-publish (trusts refs/heads/main of this repository)
      contents: read
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      # One line per published image: ECR repository | tag | Dockerfile | extra build arguments.
      #
      # The worker is published TWICE from the same Dockerfile, because the three roles built from it do not all
      # need the same thing. Only `generate` reads documents a user supplied, so only it loads the semantic
      # detector; `score` judges text the generate role already admitted and stored, and `sweep` touches no text
      # at all (scripts/audit-guard.sh checks exactly that: "no detector is expected" on the scorer). The detector
      # target bakes in @huggingface/transformers and the 1.1 GB Llama Prompt Guard 2 weights, about 1.6 GB, so
      # pointing the scorer and the sweeper at `<sha>-slim` saves them pulling a model they never load.
      # Same repository, a second tag: no new ECR repository to create in jhgcc1/quizforge-infra.
      - name: "Build and push api, worker (detector + slim) and redteam (tagged with the commit sha; immutable; an existing tag is skipped)"
        run: |
          images="
          api|$TAG|api/Dockerfile|
          worker|$TAG|worker/Dockerfile|--target runtime-detector
          worker|$TAG-slim|worker/Dockerfile|--target runtime
          redteam|$TAG|guardrails/promptfoo/Dockerfile|--build-arg GIT_SHA=$TAG
          "
          echo "$images" | grep . | while IFS='|' read -r name tag dockerfile extra; do
            repo="${{ steps.ecr.outputs.registry }}/quizforge/$name"
            if aws ecr describe-images --repository-name "quizforge/$name" --image-ids imageTag="$tag" >/dev/null 2>&1; then
              echo "$name:$tag already in ECR, skipping"; continue
            fi
            # the two worker images share a build cache scope on purpose: `runtime` is a stage of the same build
            docker buildx build -f "$dockerfile" $extra -t "$repo:$tag" --push \
              --cache-from type=gha,scope="$name"-arm --cache-to type=gha,scope="$name"-arm,mode=max .
          done
      - name: Summary
        run: |
          {
            echo "### Published \`${TAG::12}\` to ECR (api, worker, worker-slim, redteam). Deploy it from jhgcc1/quizforge-infra (workflow Deploy)."
            echo ""
            echo "- \`quizforge/worker:$TAG\` — carries Llama Prompt Guard 2. For the **generate** service."
            echo "- \`quizforge/worker:$TAG-slim\` — same code, no detector (~1.6 GB smaller). For the **scorer** service and the **sweeper** task."
          } >> "$GITHUB_STEP_SUMMARY"
