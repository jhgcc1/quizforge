# PUBLIC dataset part of the nightly run (guardrails/run-suite.sh redteam-public, and redteam-nightly after the canary part).
# The tests are written by guardrails/promptfoo/redteam/public/build.ts into guardrails/promptfoo/out/public/tests.yaml: a seeded sample of public prompt-injection
# datasets (Hugging Face), by dataset and language. The provider needs MINIMAX_API_KEY only for the stage B and encoded cases (the real model).
description: "QuizForge red team, public datasets (seeded daily sample, en/pt/es and blocked languages)"
prompts:
  - "{{text}}"
providers:
  - id: file://public/provider.ts
    label: redteam-public
tests: file://../out/public/tests.yaml
