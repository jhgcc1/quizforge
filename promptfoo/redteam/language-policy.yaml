# Language policy group of the red team (NOT part of the 50 frozen cases): a README written in a language the product does not accept
# (fr, de, it, hi, th) must be rejected BEFORE the model is called. Benign documents: the point is the language, not an attack.
- description: "POLICY French README is rejected before the model"
  vars: { kind: readme, lang: fr }
  assert:
    - { type: javascript, value: "file://../assertions.js:rejectedLanguage" }
- description: "POLICY German README is rejected before the model"
  vars: { kind: readme, lang: de }
  assert:
    - { type: javascript, value: "file://../assertions.js:rejectedLanguage" }
- description: "POLICY Italian README is rejected before the model"
  vars: { kind: readme, lang: it }
  assert:
    - { type: javascript, value: "file://../assertions.js:rejectedLanguage" }
- description: "POLICY Hindi README is rejected before the model"
  vars: { kind: readme, lang: hi }
  assert:
    - { type: javascript, value: "file://../assertions.js:rejectedLanguage" }
- description: "POLICY Thai README is rejected before the model"
  vars: { kind: readme, lang: th }
  assert:
    - { type: javascript, value: "file://../assertions.js:rejectedLanguage" }
